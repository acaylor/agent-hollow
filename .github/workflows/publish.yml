name: Publish to npm

# Publishes the `agent-hollow` package to npm when a version tag is pushed
# (e.g. v0.11.0), using npm Trusted Publishing (OIDC) — no token, no secret.
# npmjs.com must list this repo + workflow as the package's Trusted Publisher
# (package → Settings → Trusted Publisher: acaylor/agent-hollow, publish.yml).
#
# Requirements: GitHub-hosted runner, `id-token: write`, npm >= 11.5.1
# Node 24.21.0 includes a compatible npm. Provenance attestation is generated
# automatically with trusted publishing.
#
# Release flow: bump package.json in a PR, then tag its merged commit.
#   git switch main && git pull --ff-only origin main
#   git tag -a v0.11.0 -m "Release v0.11.0"
#   git push origin v0.11.0
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC exchange with npm (trusted publishing + provenance)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
          }
          NODE
      - run: pnpm install --frozen-lockfile
      # prepublishOnly in package.json runs the build + full test suite first.
      - run: npm publish

name: CI

# Typecheck, unit tests, production build and a CLI smoke test on every pull
# request and every push to main. Node comes from .node-version and pnpm from
# the packageManager field in package.json, matching publish.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The client typecheck runs as part of its build below.
      - name: Typecheck shared + server
        run: pnpm --filter @agent-hollow/shared --filter @agent-hollow/server run build
      - name: Unit tests
        run: pnpm test
      - name: Build client + bundled CLI
        run: pnpm run build
      - name: Smoke test the bundled CLI
        run: |
          node dist/cli.js --demo --no-open --port 8123 > cli.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/health | grep -q '"ok":true'; then
              curl -fsS http://127.0.0.1:8123/ | grep -q '<div id="root"' && exit 0
              echo "index.html did not contain the app root"; break
            fi
            sleep 1
          done
          cat cli.log
          exit 1
